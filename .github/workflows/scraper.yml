name: Caçador de Vagas Diario

on:
  schedule:
    # 12:00 UTC equivale a 09:00 BRT (Horário de Brasília)
    - cron: '0 12 * * *'
  workflow_dispatch: # Adiciona um botão para você rodar manualmente pelo GitHub

jobs:
  rodar-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dá permissão para o bot salvar o arquivo JSON de volta

    steps:
    - name: Clonar o repositório
      uses: actions/checkout@v4

    - name: Configurar o Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2' # Versão estável
        bundler-cache: true # Instala as gems rapidamente

    - name: Executar a varredura
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: bundle exec ruby scraper.rb

    - name: Salvar vagas já processadas no GitHub
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add vagas_vistas.json
        # Só faz o commit se houver vagas novas na memória
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: atualiza memoria de vagas processadas [skip ci]" && git push)
